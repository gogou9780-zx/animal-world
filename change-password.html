<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เปลี่ยนรหัสผ่าน | โลกสัตว์น่ารู้</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="motion.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <a class="skip" href="#form">ข้ามไปแบบฟอร์ม</a>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>โลกสัตว์น่ารู้</a>
    </div>
  </header>

  <main class="reg">
    <div class="wrap">
      <div class="reg-side">
        <h1>เปลี่ยนรหัสผ่าน</h1>
        <p class="lead">เพื่อความปลอดภัย กรุณาตั้งรหัสผ่านใหม่ก่อนใช้งานต่อ</p>
        <ul class="perks">
          <li>ใช้อย่างน้อย 8 ตัวอักษร</li>
          <li>ต้องไม่ซ้ำกับรหัสผ่านเดิม</li>
        </ul>
      </div>

      <div class="form-card">
        <form id="form" novalidate>
          <h2>ตั้งรหัสผ่านใหม่</h2>

          <div class="field">
            <label for="old">รหัสผ่านเดิม</label>
            <input type="password" id="old" name="old" maxlength="100" autocomplete="current-password" aria-describedby="old-err">
            <div class="err" id="old-err"></div>
          </div>

          <div class="field">
            <label for="new1">รหัสผ่านใหม่</label>
            <input type="password" id="new1" name="new1" maxlength="100" autocomplete="new-password" aria-describedby="new1-err">
            <div class="err" id="new1-err"></div>
          </div>

          <div class="field">
            <label for="new2">ยืนยันรหัสผ่านใหม่</label>
            <input type="password" id="new2" name="new2" maxlength="100" autocomplete="new-password" aria-describedby="new2-err">
            <div class="err" id="new2-err"></div>
          </div>

          <button class="btn btn-moss" id="submit" type="submit">บันทึกรหัสผ่านใหม่</button>
          <div class="banner" id="banner" role="alert"></div>
          <p class="sub" style="margin-top:18px"><button class="link-quiet" type="button" id="leave">ออกจากระบบ</button></p>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap"><p class="copy">© 2026 โลกสัตว์น่ารู้ สงวนลิขสิทธิ์</p></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="member.js"></script>
  <script>
    const m = window.Member.get() || {};
    let session = null;
    // ต้องเข้าสู่ระบบก่อน
    const ready = (window.sb ? sb.auth.getSession() : Promise.resolve({ data: {} })).then(function (r) {
      session = r.data.session;
      if (!session) { window.Member.clear(); location.replace("login.html"); }
    });

    const form = document.getElementById("form");
    const btn = document.getElementById("submit");
    const banner = document.getElementById("banner");

    function setError(id, text) {
      document.getElementById(id + "-err").textContent = text;
      document.getElementById(id).setAttribute("aria-invalid", text ? "true" : "false");
    }

    document.getElementById("leave").addEventListener("click", function () {
      window.Member.clear();
      location.href = "index.html";
    });

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      banner.className = "banner";
      const oldPass = document.getElementById("old").value;
      const new1 = document.getElementById("new1").value;
      const new2 = document.getElementById("new2").value;

      const oldBad = oldPass ? "" : "กรอกรหัสผ่านเดิม";
      const new1Bad = new1.length < 8 ? "รหัสผ่านใหม่ต้องมีอย่างน้อย 8 ตัวอักษร"
                    : new1 === oldPass ? "รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสเดิม" : "";
      const new2Bad = new2 === new1 ? "" : "รหัสผ่านไม่ตรงกัน";
      setError("old", oldBad);
      setError("new1", new1Bad);
      setError("new2", new2Bad);
      if (oldBad) { document.getElementById("old").focus(); return; }
      if (new1Bad) { document.getElementById("new1").focus(); return; }
      if (new2Bad) { document.getElementById("new2").focus(); return; }

      await ready;
      if (!session) return;

      btn.disabled = true;
      btn.textContent = "กำลังบันทึก...";
      try {
        // ตรวจรหัสผ่านเดิมด้วยการล็อกอินซ้ำ
        const chk = await sb.auth.signInWithPassword({ email: session.user.email, password: oldPass });
        if (chk.error) {
          setError("old", "รหัสผ่านเดิมไม่ถูกต้อง");
          document.getElementById("old").focus();
          return;
        }
        const upd = await sb.auth.updateUser({ password: new1 });
        if (upd.error) {
          banner.textContent = /same|different/i.test(upd.error.message) ? "รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสเดิม" : "เปลี่ยนรหัสผ่านไม่สำเร็จ";
          banner.className = "banner show";
          return;
        }
        await sb.from("members").update({ must_change: false }).eq("user_id", session.user.id);
        window.Member.set({ name: m.name, memberId: m.memberId }); // ปลดล็อก
        location.href = "member.html";
      } catch (err) {
        banner.textContent = "เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง";
        banner.className = "banner show";
      } finally {
        btn.disabled = false;
        btn.textContent = "บันทึกรหัสผ่านใหม่";
      }
    });
  </script>
  <script src="sidebar.js"></script>
  <script src="motion.js"></script>
  <script src="auth.js"></script>
</body>
</html>
